<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spidey Kaiju Egg Timer</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f131d;
      --spidey-red: #e11d48;
      --spidey-blue: #2563eb;
      --white: #f8fafc;
      --gray: #64748b;
      --border: #1e2536;
      --web-color: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 1.8rem;
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(225, 29, 72, 0.1);
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.15rem;
      background: linear-gradient(135deg, #f43f5e 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 1rem;
    }

    /* Stage Area */
    .stage-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    svg.progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 10;
      pointer-events: none;
    }

    circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: #161c2b;
    }

    .circle-progress {
      stroke: var(--spidey-red);
      stroke-dasharray: 691.15;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.3s ease;
    }

    .stage-viewport {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle, #1a1528 0%, #080a12 100%);
      border: 2px solid #2d1b33;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
      cursor: crosshair;
    }

    /* Game Canvas */
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 4;
    }

    .game-hud {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      font-size: 0.8rem;
      font-weight: 800;
      color: #e2e8f0;
      z-index: 5;
      pointer-events: none;
    }

    /* Story Animation Layer */
    .actor-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .svg-actor {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #eggActor svg {
      width: 85px;
      height: 110px;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    #henActor {
      opacity: 0;
      transform: scale(0.2);
    }

    #henActor svg {
      width: 100px;
      height: 110px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }

    .thruster-flame {
      opacity: 0;
      transform-origin: top center;
    }

    .ignited .thruster-flame {
      opacity: 1;
      animation: flame-pulse 0.15s infinite alternate;
    }

    @keyframes flame-pulse {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.2) translateY(4px); }
    }

    .blastoff {
      animation: launch-skyward 1.1s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
    }

    @keyframes launch-skyward {
      0% { transform: translateY(0) scale(1.1); }
      30% { transform: translateY(10px) scale(1.2, 0.9); }
      100% { transform: translateY(-400px) scale(0.5); opacity: 0; }
    }

    #friedActor {
      opacity: 0;
      transform: translateY(-200px) scale(0.4);
    }

    #friedActor svg {
      width: 85px;
      height: 65px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
    }

    #friedActor.landed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Kaiju Spider Monster */
    #monsterActor {
      position: absolute;
      bottom: -150px;
      width: 150px;
      height: 150px;
      z-index: 6;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    #monsterActor svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 -5px 15px rgba(0, 0, 0, 0.7));
    }

    #monsterActor.appear {
      transform: translateY(-100px);
    }

    .jaw {
      transform-origin: 75px 95px;
      transition: transform 0.2s ease;
    }

    .chomp .jaw {
      transform: translateY(-16px);
    }

    /* UI Controls */
    .time-readout {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 0.85rem;
    }

    .presets-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-bottom: 0.75rem;
    }

    .preset-btn {
      flex: 1;
      background: #0c0e17;
      border: 1px solid var(--border);
      color: var(--white);
      border-radius: 10px;
      padding: 0.6rem 0;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      border-color: var(--spidey-red);
      color: var(--spidey-red);
    }

    .custom-inputs {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #0c0e17;
      border: 1px solid var(--border);
      padding: 0.55rem 0.8rem;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 1rem;
    }

    .custom-inputs input {
      width: 50px;
      background: #141926;
      border: 1px solid #232d42;
      border-radius: 8px;
      padding: 0.35rem;
      color: var(--white);
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .set-custom-btn {
      background: var(--spidey-blue);
      border: none;
      color: var(--white);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary { 
      background: linear-gradient(135deg, var(--spidey-red) 0%, #b91c1c 100%); 
      color: #fff; 
    }
    .btn-secondary { background: #1c2333; color: var(--white); }
  </style>
</head>
<body>

  <main class="timer-card">
    <h1>Web-Slinger Egg Timer</h1>
    <p class="subtitle">Shoot webs to catch eggs before the spider kaiju awakens</p>

    <div class="stage-wrapper">
      <svg class="progress-ring">
        <circle class="circle-bg" cx="120" cy="120" r="110"></circle>
        <circle class="circle-progress" id="progressCircle" cx="120" cy="120" r="110"></circle>
      </svg>

      <div class="stage-viewport" id="stageViewport">
        <!-- Spidey Web Arcade Canvas -->
        <canvas id="gameCanvas" width="210" height="210"></canvas>
        <div class="game-hud" id="gameHud">
          <span>SNAGGED: <strong id="hudScore" style="color: #38bdf8;">0</strong></span>
          <span>SHIELD: <strong id="hudLives" style="color: var(--spidey-red);">🕸🕸🕸</strong></span>
        </div>

        <!-- Animation Layer -->
        <div class="actor-container" id="actorContainer">
          <!-- Egg with Web Suit Texture -->
          <div class="svg-actor" id="eggActor">
            <svg viewBox="0 0 100 130">
              <defs>
                <linearGradient id="spideyEgg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#e11d48"/>
                  <stop offset="70%" stop-color="#9f1239"/>
                  <stop offset="100%" stop-color="#1e1b4b"/>
                </linearGradient>
              </defs>
              <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" fill="url(#spideyEgg)"/>
              <!-- Spider Mask Eyes -->
              <path d="M 28 50 Q 40 40 46 62 Q 35 68 28 50 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
              <path d="M 72 50 Q 60 40 54 62 Q 65 68 72 50 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
            </svg>
          </div>

          <!-- Spidey Hen with Web Rocket -->
          <div class="svg-actor" id="henActor">
            <svg viewBox="0 0 140 140">
              <g id="rocketPack" transform="translate(90, 30)">
                <rect x="0" y="15" width="22" height="50" rx="10" fill="#2563eb"/>
                <polygon points="11,-2 -3,15 25,15" fill="#1d4ed8"/>
                <g class="thruster-flame">
                  <polygon points="3,65 11,85 19,65" fill="#38bdf8"/>
                  <polygon points="6,65 11,78 16,65" fill="#e11d48"/>
                </g>
              </g>
              <g transform="translate(15, 20)">
                <!-- Spider Suit Chick -->
                <ellipse cx="45" cy="55" rx="35" ry="35" fill="#e11d48"/>
                <path d="M 20 55 C 20 70, 35 75, 42 65" fill="#2563eb"/>
                <polygon points="65,48 82,54 65,60" fill="#f59e0b"/>
                <!-- Hero Eyes -->
                <path d="M 38 42 Q 48 35 52 50 Q 42 54 38 42 Z" fill="#fff" stroke="#000" stroke-width="2"/>
                <path d="M 68 42 Q 58 35 54 50 Q 64 54 68 42 Z" fill="#fff" stroke="#000" stroke-width="2"/>
              </g>
            </svg>
          </div>

          <!-- Roasted Drumstick -->
          <div class="svg-actor" id="friedActor">
            <svg viewBox="0 0 120 90">
              <defs>
                <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#d97706"/>
                  <stop offset="60%" stop-color="#b45309"/>
                  <stop offset="100%" stop-color="#78350f"/>
                </linearGradient>
              </defs>
              <path d="M 80 40 L 105 32" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
              <circle cx="106" cy="28" r="6" fill="#f8fafc"/>
              <circle cx="110" cy="36" r="6" fill="#f8fafc"/>
              <ellipse cx="48" cy="45" rx="40" ry="28" fill="url(#crustGrad)"/>
            </svg>
          </div>
        </div>

        <!-- Kaiju Spider-Monster -->
        <div id="monsterActor">
          <svg viewBox="0 0 150 150">
            <defs>
              <linearGradient id="kaijuSkin" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1e1b4b"/>
                <stop offset="100%" stop-color="#090a10"/>
              </linearGradient>
            </defs>
            <!-- Spider Legs -->
            <path d="M 20 80 Q -10 50 15 20" stroke="#e11d48" stroke-width="5" fill="none"/>
            <path d="M 130 80 Q 160 50 135 20" stroke="#e11d48" stroke-width="5" fill="none"/>
            <path d="M 25 100 Q -10 90 10 60" stroke="#e11d48" stroke-width="5" fill="none"/>
            <path d="M 125 100 Q 160 90 140 60" stroke="#e11d48" stroke-width="5" fill="none"/>

            <!-- Main Body -->
            <path d="M 25 150 C 25 35, 125 35, 125 150 Z" fill="url(#kaijuSkin)" stroke="#e11d48" stroke-width="2"/>

            <!-- Multiple Glowing Eyes -->
            <circle cx="45" cy="60" r="6" fill="#e11d48"/>
            <circle cx="60" cy="55" r="7" fill="#38bdf8"/>
            <circle cx="90" cy="55" r="7" fill="#38bdf8"/>
            <circle cx="105" cy="60" r="6" fill="#e11d48"/>

            <g class="jaw" id="monsterJaw">
              <path d="M 45 92 Q 75 118 105 92 Z" fill="#881337"/>
              <polygon points="50,92 55,100 60,92" fill="#fff"/>
              <polygon points="65,92 70,102 75,92" fill="#fff"/>
              <polygon points="80,92 85,102 90,92" fill="#fff"/>
              <polygon points="95,92 100,100 105,92" fill="#fff"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="time-readout" id="display">00:15</div>

    <div class="presets-row">
      <button class="preset-btn" data-seconds="15">15s Demo</button>
      <button class="preset-btn" data-seconds="60">1 Min</button>
      <button class="preset-btn" data-seconds="180">3 Min</button>
    </div>

    <div class="custom-inputs">
      <input type="number" id="customMin" min="0" max="999" placeholder="0" />
      <span>m</span>
      <input type="number" id="customSec" min="0" max="59" placeholder="0" />
      <span>s</span>
      <button class="set-custom-btn" id="applyCustomBtn">Set</button>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
      <button class="btn btn-primary" id="startBtn">Start</button>
    </div>
  </main>

  <script>
    function playSfx(f1, f2, dur, type = 'sine') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + dur);
        gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    const radius = 110;
    const circumference = 2 * Math.PI * radius;
    const circle = document.getElementById('progressCircle');
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    let totalSeconds = 15;
    let remainingSeconds = 15;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetButtons = document.querySelectorAll('.preset-btn');
    const customMin = document.getElementById('customMin');
    const customSec = document.getElementById('customSec');
    const applyCustomBtn = document.getElementById('applyCustomBtn');

    const actorContainer = document.getElementById('actorContainer');
    const eggActor = document.getElementById('eggActor');
    const henActor = document.getElementById('henActor');
    const friedActor = document.getElementById('friedActor');
    const monsterActor = document.getElementById('monsterActor');
    const monsterJaw = document.getElementById('monsterJaw');

    // Spider-Man Web Arcade Engine
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameHud = document.getElementById('gameHud');
    const hudScore = document.getElementById('hudScore');
    const hudLives = document.getElementById('hudLives');

    let gameActive = false;
    let animationFrameId = null;
    let score = 0;
    let lives = 3;
    let crosshair = { x: 105, y: 105 };
    let webLines = [];
    let targets = [];
    let spawnTimer = 0;

    function resetArcadeState() {
      score = 0;
      lives = 3;
      targets = [];
      webLines = [];
      spawnTimer = 0;
      hudScore.textContent = score;
      hudLives.textContent = '🕸🕸🕸';
    }

    function spawnTarget() {
      const isBomb = Math.random() < 0.35;
      targets.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: -12,
        radius: isBomb ? 11 : 9,
        speed: 1.6 + Math.random() * 1.6,
        type: isBomb ? 'bomb' : 'egg'
      });
    }

    function shootWeb(clickX, clickY) {
      if (!gameActive) return;
      playSfx(800, 200, 0.1, 'triangle'); // Web thwip sound!

      // Origin shooter at bottom center
      webLines.push({
        fromX: 105,
        fromY: 210,
        toX: clickX,
        toY: clickY,
        life: 10
      });

      // Check hit collision
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const dist = Math.hypot(t.x - clickX, t.y - clickY);

        if (dist <= t.radius + 14) {
          if (t.type === 'egg') {
            score += 10;
            hudScore.textContent = score;
            playSfx(550, 950, 0.15, 'sine');
          } else {
            lives--;
            hudLives.textContent = '🕸'.repeat(Math.max(0, lives));
            playSfx(140, 60, 0.25, 'sawtooth');
            if (lives <= 0) {
              lives = 3;
              hudLives.textContent = '🕸🕸🕸';
            }
          }
          targets.splice(i, 1);
          break;
        }
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      crosshair.x = e.clientX - rect.left;
      crosshair.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      shootWeb(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        shootWeb(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
      }
    }, { passive: true });

    function updateGame() {
      if (!gameActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Web background net pattern
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(105, 105, 50, 0, Math.PI * 2);
      ctx.arc(105, 105, 85, 0, Math.PI * 2);
      ctx.stroke();

      // Spawn falling targets
      spawnTimer++;
      if (spawnTimer % 35 === 0) spawnTarget();

      // Draw web shot lines
      for (let i = webLines.length - 1; i >= 0; i--) {
        const line = webLines[i];
        ctx.strokeStyle = `rgba(255, 255, 255, ${line.life / 10})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(line.fromX, line.fromY);
        ctx.lineTo(line.toX, line.toY);
        ctx.stroke();

        // Web splatter at tip
        ctx.beginPath();
        ctx.arc(line.toX, line.toY, 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${line.life / 10})`;
        ctx.fill();

        line.life--;
        if (line.life <= 0) webLines.splice(i, 1);
      }

      // Update & render targets
      for (let i = targets.length - 1; i >= 0; i--) {
        const item = targets[i];
        item.y += item.speed;

        if (item.type === 'egg') {
          // Golden Web-Egg
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.ellipse(item.x, item.y, item.radius * 0.8, item.radius, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Pumpkin Bomb
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
          ctx.fill();
          // Bomb face glow
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(item.x - 4, item.y - 3, 2, 2);
          ctx.fillRect(item.x + 2, item.y - 3, 2, 2);
        }

        if (item.y > canvas.height + 20) targets.splice(i, 1);
      }

      // Spider Crosshair
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(crosshair.x, crosshair.y, 8, 0, Math.PI * 2);
      ctx.stroke();

      animationFrameId = requestAnimationFrame(updateGame);
    }

    function showArcadeGame(show) {
      gameActive = show;
      canvas.style.display = show ? 'block' : 'none';
      gameHud.style.display = show ? 'flex' : 'none';
      actorContainer.style.display = show ? 'none' : 'flex';

      if (show) {
        updateGame();
      } else if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
    }

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const progressFraction = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      circle.style.strokeDashoffset = circumference - (progressFraction * circumference);
    }

    function runFinaleSequence() {
      showArcadeGame(false);

      eggActor.style.opacity = '0';
      henActor.style.opacity = '1';
      henActor.style.transform = 'scale(0.7)';

      setTimeout(() => {
        henActor.style.transform = 'scale(1.1)';
        playSfx(400, 600, 0.25, 'triangle');
      }, 500);

      setTimeout(() => {
        henActor.classList.add('ignited');
        playSfx(200, 800, 1.1, 'sawtooth');
      }, 1000);

      setTimeout(() => {
        henActor.classList.add('blastoff');
      }, 1400);

      setTimeout(() => {
        henActor.style.display = 'none';
        friedActor.classList.add('landed');
        playSfx(480, 220, 0.35, 'sine');
      }, 2500);

      setTimeout(() => {
        monsterActor.classList.add('appear');
        playSfx(80, 140, 0.45, 'triangle');
      }, 3100);

      setTimeout(() => {
        monsterJaw.classList.add('chomp');
        friedActor.style.opacity = '0';
        playSfx(200, 70, 0.3, 'square');
      }, 3800);

      setTimeout(() => {
        monsterJaw.classList.remove('chomp');
      }, 4400);
    }

    function resetVisuals() {
      showArcadeGame(false);
      resetArcadeState();

      henActor.classList.remove('ignited', 'blastoff');
      henActor.style.display = 'flex';
      henActor.style.opacity = '0';
      henActor.style.transform = 'scale(0.2)';
      eggActor.style.opacity = '1';
      friedActor.classList.remove('landed');
      friedActor.style.opacity = '0';
      monsterActor.classList.remove('appear');
      monsterJaw.classList.remove('chomp');
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Resume';
        showArcadeGame(false);
        return;
      }

      if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        resetVisuals();
      }

      isRunning = true;
      startBtn.textContent = 'Pause';
      showArcadeGame(true);

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
          runFinaleSequence();
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      resetVisuals();
      updateDisplay();
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        totalSeconds = parseInt(btn.getAttribute('data-seconds'), 10);
        resetTimer();
      });
    });

    applyCustomBtn.addEventListener('click', () => {
      const mins = parseInt(customMin.value, 10) || 0;
      const secs = parseInt(customSec.value, 10) || 0;
      const total = mins * 60 + secs;

      if (total > 0) {
        totalSeconds = total;
        resetTimer();
      } else {
        alert('Please enter a duration greater than 0 seconds.');
      }
    });

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
