<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaiju Egg Timer</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #131722;
      --accent: #f59e0b;
      --white: #f8fafc;
      --gray: #64748b;
      --border: #22293a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 1.25rem;
    }

    /* Animation Stage */
    .stage-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    svg.progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 5;
      pointer-events: none;
    }

    circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: #1e2638;
    }

    .circle-progress {
      stroke: var(--accent);
      stroke-dasharray: 565.48;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.3s ease;
    }

    .stage-display {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d111a;
      border: 3px solid #1f2738;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      position: relative;
    }

    .stage-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    /* Controls UI */
    .time-readout {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1rem;
    }

    .presets-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-bottom: 0.85rem;
    }

    .preset-btn {
      flex: 1;
      background: #0c0f16;
      border: 1px solid var(--border);
      color: var(--white);
      border-radius: 10px;
      padding: 0.6rem 0;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-inputs {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #0c0f16;
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 1.2rem;
    }

    .custom-inputs input {
      width: 50px;
      background: #151922;
      border: 1px solid #283144;
      border-radius: 8px;
      padding: 0.35rem;
      color: var(--white);
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .set-custom-btn {
      background: #232c3f;
      border: none;
      color: var(--white);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #232938; color: var(--white); }
  </style>
</head>
<body>

  <main class="timer-card">
    <h1>Kaiju Egg Timer</h1>
    <p class="subtitle">Countdown to a monster feast</p>

    <div class="stage-wrapper">
      <svg class="progress-ring">
        <circle class="circle-bg" cx="110" cy="110" r="90"></circle>
        <circle class="circle-progress" id="progressCircle" cx="110" cy="110" r="90"></circle>
      </svg>

      <div class="stage-display">
        <img id="mediaStage" src="https://media.giphy.com/media/l41lI4bYmcsPJX9Go/giphy.gif" alt="Egg Boiling" />
      </div>
    </div>

    <div class="time-readout" id="display">00:05</div>

    <div class="presets-row">
      <button class="preset-btn" data-seconds="5">5s (Demo)</button>
      <button class="preset-btn" data-seconds="60">1 Min</button>
      <button class="preset-btn" data-seconds="180">3 Min</button>
    </div>

    <div class="custom-inputs">
      <input type="number" id="customMin" min="0" max="999" placeholder="0" />
      <span>m</span>
      <input type="number" id="customSec" min="0" max="59" placeholder="0" />
      <span>s</span>
      <button class="set-custom-btn" id="applyCustomBtn">Set</button>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
      <button class="btn btn-primary" id="startBtn">Start</button>
    </div>
  </main>

  <script>
    // Cartoon GIF Assets
    const ASSETS = {
      idle: "https://media.giphy.com/media/l41lI4bYmcsPJX9Go/giphy.gif",              // Boiling egg
      launch: "https://media.giphy.com/media/mi6t8WXj5ffYQ/giphy.gif",            // Rocket Blastoff
      friedChicken: "https://media.giphy.com/media/l0MYyEsjhIXdzv9PG/giphy.gif",      // Roasted crispy chicken
      kaijuChomp: "https://media.giphy.com/media/3KbliBOdHlUE8/giphy.gif"             // Godzilla Roar & Chomp
    };

    const circle = document.getElementById('progressCircle');
    const radius = 90;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    let totalSeconds = 5;
    let remainingSeconds = 5;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetButtons = document.querySelectorAll('.preset-btn');
    const customMin = document.getElementById('customMin');
    const customSec = document.getElementById('customSec');
    const applyCustomBtn = document.getElementById('applyCustomBtn');
    const mediaStage = document.getElementById('mediaStage');

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const progressFraction = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      circle.style.strokeDashoffset = circumference - (progressFraction * circumference);
    }

    function setStageImage(url) {
      mediaStage.style.opacity = '0';
      setTimeout(() => {
        mediaStage.src = url;
        mediaStage.style.opacity = '1';
      }, 200);
    }

    function playAudio(f1, f2, dur, type = 'sine') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + dur);
        gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function runFinaleSequence() {
      // 1. Blastoff sequence
      setStageImage(ASSETS.launch);
      playAudio(200, 800, 1.2, 'sawtooth');

      // 2. Returns as sizzling fried chicken
      setTimeout(() => {
        setStageImage(ASSETS.friedChicken);
        playAudio(600, 200, 0.4, 'sine');
      }, 2200);

      // 3. Godzilla emerges and eats it
      setTimeout(() => {
        setStageImage(ASSETS.kaijuChomp);
        playAudio(120, 60, 0.6, 'square');
      }, 4200);
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Resume';
        return;
      }

      if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        setStageImage(ASSETS.idle);
      }

      isRunning = true;
      startBtn.textContent = 'Pause';

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
          runFinaleSequence();
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      setStageImage(ASSETS.idle);
      updateDisplay();
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        totalSeconds = parseInt(btn.getAttribute('data-seconds'), 10);
        resetTimer();
      });
    });

    applyCustomBtn.addEventListener('click', () => {
      const mins = parseInt(customMin.value, 10) || 0;
      const secs = parseInt(customSec.value, 10) || 0;
      const total = mins * 60 + secs;

      if (total > 0) {
        totalSeconds = total;
        resetTimer();
      } else {
        alert('Please enter a duration greater than 0 seconds.');
      }
    });

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
