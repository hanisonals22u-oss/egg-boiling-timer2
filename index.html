<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaiju Egg Timer</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #131722;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.3);
      --white: #f8fafc;
      --gray: #64748b;
      --border: #22293a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    .timer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 1rem;
    }

    .stage {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(circle, #1a2030 0%, #0d1017 100%);
    }

    svg.progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      z-index: 10;
      pointer-events: none;
    }

    circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: #1e2638;
    }

    .circle-progress {
      stroke: var(--accent);
      stroke-dasharray: 565.48;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.3s ease;
    }

    .actor-container {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .svg-actor {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 1. Egg Shake Animation */
    #eggActor svg {
      width: 85px;
      height: 110px;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
    }

    .ticking #eggActor svg {
      animation: egg-heartbeat 0.9s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes egg-heartbeat {
      0% { transform: scale(1, 1) rotate(0deg); }
      20% { transform: scale(1.08, 0.92) rotate(-4deg); }
      40% { transform: scale(0.94, 1.06) rotate(4deg); }
      60% { transform: scale(1.03, 0.97) rotate(-2deg); }
      80% { transform: scale(0.98, 1.02) rotate(2deg); }
      100% { transform: scale(1, 1) rotate(0deg); }
    }

    /* 2. Chick / Hen */
    #henActor {
      opacity: 0;
      transform: scale(0.2);
    }

    #henActor svg {
      width: 100px;
      height: 110px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
    }

    /* 3. Rocket Thruster */
    .thruster-flame {
      opacity: 0;
      transform-origin: top center;
    }

    .ignited .thruster-flame {
      opacity: 1;
      animation: flame-pulse 0.15s infinite alternate;
    }

    @keyframes flame-pulse {
      0% { transform: scale(0.9) translateY(0); }
      100% { transform: scale(1.2) translateY(4px); }
    }

    .blastoff {
      animation: launch-skyward 1.1s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
    }

    @keyframes launch-skyward {
      0% { transform: translateY(0) scale(1.1); }
      25% { transform: translateY(10px) scale(1.2, 0.9); }
      40% { transform: translateY(-30px) scale(0.9, 1.3); }
      100% { transform: translateY(-400px) scale(0.5); opacity: 0; }
    }

    /* 4. Fried Chicken Drumstick */
    #friedActor {
      opacity: 0;
      transform: translateY(-200px) scale(0.4);
    }

    #friedActor svg {
      width: 90px;
      height: 70px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
    }

    #friedActor.landed {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 5. SVG Kaiju Monster */
    #monsterActor {
      position: absolute;
      bottom: -150px;
      width: 150px;
      height: 150px;
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    #monsterActor svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 -5px 15px rgba(0, 0, 0, 0.6));
    }

    #monsterActor.appear {
      transform: translateY(-110px);
    }

    .jaw {
      transform-origin: 75px 95px;
      transition: transform 0.2s ease;
    }

    .chomp .jaw {
      transform: translateY(-16px);
    }

    /* UI Readout & Controls */
    .time-readout {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1rem;
    }

    .presets-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-bottom: 0.85rem;
      z-index: 20;
    }

    .preset-btn {
      flex: 1;
      background: #0c0f16;
      border: 1px solid var(--border);
      color: var(--white);
      border-radius: 10px;
      padding: 0.6rem 0;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-inputs {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: #0c0f16;
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 1.2rem;
      z-index: 20;
    }

    .custom-inputs input {
      width: 50px;
      background: #151922;
      border: 1px solid #283144;
      border-radius: 8px;
      padding: 0.35rem;
      color: var(--white);
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .set-custom-btn {
      background: #232c3f;
      border: none;
      color: var(--white);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: auto;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      z-index: 20;
    }

    .btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #232938; color: var(--white); }
  </style>
</head>
<body>

  <main class="timer-card">
    <h1>Kaiju Egg Timer</h1>
    <p class="subtitle">Countdown to a monster feast</p>

    <div class="stage" id="stage">
      <svg class="progress-ring">
        <circle class="circle-bg" cx="110" cy="110" r="90"></circle>
        <circle class="circle-progress" id="progressCircle" cx="110" cy="110" r="90"></circle>
      </svg>

      <div class="actor-container">
        <div class="svg-actor" id="eggActor">
          <svg viewBox="0 0 100 130">
            <defs>
              <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="65%" stop-color="#f1f5f9"/>
                <stop offset="100%" stop-color="#cbd5e1"/>
              </linearGradient>
            </defs>
            <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" fill="url(#eggGrad)"/>
            <path d="M 28 25 C 38 12, 55 12, 60 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
          </svg>
        </div>

        <div class="svg-actor" id="henActor">
          <svg viewBox="0 0 140 140">
            <g id="rocketPack" transform="translate(90, 30)">
              <rect x="0" y="15" width="22" height="50" rx="10" fill="#ef4444"/>
              <polygon points="11,-2 -3,15 25,15" fill="#991b1b"/>
              <rect x="5" y="28" width="12" height="12" rx="6" fill="#f8fafc"/>
              <g class="thruster-flame" id="rocketFlame">
                <polygon points="3,65 11,85 19,65" fill="#f59e0b"/>
                <polygon points="6,65 11,78 16,65" fill="#ef4444"/>
              </g>
            </g>
            <g transform="translate(15, 20)">
              <path d="M 35 15 C 32 5, 42 2, 45 10 C 48 2, 58 4, 55 15 Z" fill="#ef4444"/>
              <ellipse cx="45" cy="55" rx="35" ry="35" fill="#facc15"/>
              <path d="M 20 55 C 20 70, 35 75, 42 65" fill="#eab308"/>
              <polygon points="65,48 82,54 65,60" fill="#ea580c"/>
              <ellipse cx="68" cy="64" rx="4" ry="7" fill="#ef4444"/>
              <circle cx="54" cy="45" r="7" fill="#000"/>
              <circle cx="56" cy="43" r="2.5" fill="#fff"/>
            </g>
          </svg>
        </div>

        <div class="svg-actor" id="friedActor">
          <svg viewBox="0 0 120 90">
            <defs>
              <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d97706"/>
                <stop offset="60%" stop-color="#b45309"/>
                <stop offset="100%" stop-color="#78350f"/>
              </linearGradient>
            </defs>
            <path d="M 80 40 L 105 32" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
            <circle cx="106" cy="28" r="6" fill="#f8fafc"/>
            <circle cx="110" cy="36" r="6" fill="#f8fafc"/>
            <ellipse cx="48" cy="45" rx="40" ry="28" fill="url(#crustGrad)"/>
            <circle cx="28" cy="35" r="6" fill="#92400e" opacity="0.6"/>
            <circle cx="52" cy="55" r="5" fill="#92400e" opacity="0.6"/>
            <circle cx="65" cy="38" r="4" fill="#92400e" opacity="0.6"/>
          </svg>
        </div>
      </div>

      <div id="monsterActor">
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="kaijuSkin" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#15803d"/>
            </linearGradient>
          </defs>
          <path d="M 25 150 C 25 35, 125 35, 125 150 Z" fill="url(#kaijuSkin)"/>
          <polygon points="35,50 25,25 48,42" fill="#166534"/>
          <polygon points="115,50 125,25 102,42" fill="#166534"/>
          <circle cx="50" cy="65" r="12" fill="#fff"/>
          <circle cx="52" cy="66" r="6" fill="#000"/>
          <circle cx="54" cy="64" r="2" fill="#fff"/>

          <circle cx="100" cy="65" r="12" fill="#fff"/>
          <circle cx="98" cy="66" r="6" fill="#000"/>
          <circle cx="96" cy="64" r="2" fill="#fff"/>

          <g class="jaw" id="monsterJaw">
            <path d="M 45 92 Q 75 118 105 92 Z" fill="#7f1d1d"/>
            <polygon points="50,92 55,100 60,92" fill="#fff"/>
            <polygon points="65,92 70,102 75,92" fill="#fff"/>
            <polygon points="80,92 85,102 90,92" fill="#fff"/>
            <polygon points="95,92 100,100 105,92" fill="#fff"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="time-readout" id="display">00:05</div>

    <div class="presets-row">
      <button class="preset-btn" data-seconds="5">5s (Demo)</button>
      <button class="preset-btn" data-seconds="60">1 Min</button>
      <button class="preset-btn" data-seconds="180">3 Min</button>
    </div>

    <div class="custom-inputs">
      <input type="number" id="customMin" min="0" max="999" placeholder="0" />
      <span>m</span>
      <input type="number" id="customSec" min="0" max="59" placeholder="0" />
      <span>s</span>
      <button class="set-custom-btn" id="applyCustomBtn">Set</button>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
      <button class="btn btn-primary" id="startBtn">Start</button>
    </div>
  </main>

  <script>
    const circle = document.getElementById('progressCircle');
    const radius = 90;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;

    let totalSeconds = 5;
    let remainingSeconds = 5;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetButtons = document.querySelectorAll('.preset-btn');
    const customMin = document.getElementById('customMin');
    const customSec = document.getElementById('customSec');
    const applyCustomBtn = document.getElementById('applyCustomBtn');

    const stage = document.getElementById('stage');
    const eggActor = document.getElementById('eggActor');
    const henActor = document.getElementById('henActor');
    const friedActor = document.getElementById('friedActor');
    const monsterActor = document.getElementById('monsterActor');
    const monsterJaw = document.getElementById('monsterJaw');

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const progressFraction = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      circle.style.strokeDashoffset = circumference - (progressFraction * circumference);
    }

    function playTone(f1, f2, dur, type = 'sine') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + dur);
        gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function runFinaleSequence() {
      // 1. Egg cracks and chick pops out
      eggActor.style.opacity = '0';
      henActor.style.opacity = '1';
      henActor.style.transform = 'scale(0.7)';

      // 2. Grows to full hen
      setTimeout(() => {
        henActor.style.transform = 'scale(1.1)';
        playTone(350, 550, 0.25, 'triangle');
      }, 500);

      // 3. Rocket ignites and launches
      setTimeout(() => {
        henActor.classList.add('ignited');
        playTone(180, 800, 1.1, 'sawtooth');
      }, 1000);

      setTimeout(() => {
        henActor.classList.add('blastoff');
      }, 1400);

      // 4. Return as fried chicken
      setTimeout(() => {
        henActor.style.display = 'none';
        friedActor.classList.add('landed');
        playTone(480, 220, 0.35, 'sine');
      }, 2500);

      // 5. Kaiju emerges
      setTimeout(() => {
        monsterActor.classList.add('appear');
        playTone(90, 150, 0.45, 'triangle');
      }, 3100);

      // 6. Chomps down
      setTimeout(() => {
        monsterJaw.classList.add('chomp');
        friedActor.style.opacity = '0';
        playTone(200, 70, 0.3, 'square');
      }, 3800);

      // 7. Smile & finish
      setTimeout(() => {
        monsterJaw.classList.remove('chomp');
      }, 4400);
    }

    function resetVisuals() {
      henActor.classList.remove('ignited', 'blastoff');
      henActor.style.display = 'flex';
      henActor.style.opacity = '0';
      henActor.style.transform = 'scale(0.2)';
      eggActor.style.opacity = '1';
      friedActor.classList.remove('landed');
      friedActor.style.opacity = '0';
      monsterActor.classList.remove('appear');
      monsterJaw.classList.remove('chomp');
      stage.classList.remove('ticking');
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Resume';
        stage.classList.remove('ticking');
        return;
      }

      if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        resetVisuals();
      }

      isRunning = true;
      startBtn.textContent = 'Pause';
      stage.classList.add('ticking');

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
          stage.classList.remove('ticking');
          runFinaleSequence();
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      resetVisuals();
      updateDisplay();
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        totalSeconds = parseInt(btn.getAttribute('data-seconds'), 10);
        resetTimer();
      });
    });

    applyCustomBtn.addEventListener('click', () => {
      const mins = parseInt(customMin.value, 10) || 0;
      const secs = parseInt(customSec.value, 10) || 0;
      const total = mins * 60 + secs;

      if (total > 0) {
        totalSeconds = total;
        resetTimer();
      } else {
        alert('Please enter a duration greater than 0 seconds.');
      }
    });

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
