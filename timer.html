<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egg Time</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f131d;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.35);
      --white: #f8fafc;
      --gray: #64748b;
      --border: #1e2536;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .dashboard-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 3.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 45px var(--accent-glow);
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 310px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
      background: linear-gradient(135deg, #22c55e 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--gray);
      margin-bottom: 1.8rem;
    }

    .time-readout {
      font-size: 4.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1.6rem;
      color: var(--white);
      letter-spacing: -1.5px;
      line-height: 1;
    }

    .presets-row {
      display: flex;
      gap: 0.7rem;
      width: 100%;
      margin-bottom: 1.1rem;
    }

    .preset-btn {
      flex: 1;
      background: #090c14;
      border: 1px solid var(--border);
      color: var(--white);
      border-radius: 12px;
      padding: 0.85rem 0;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-inputs {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #090c14;
      border: 1px solid var(--border);
      padding: 0.75rem 1.1rem;
      border-radius: 14px;
      width: 100%;
      margin-bottom: 1.8rem;
    }

    .custom-inputs input {
      width: 65px;
      background: #141926;
      border: 1px solid #232d42;
      border-radius: 8px;
      padding: 0.45rem;
      color: var(--white);
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      outline: none;
    }

    .set-custom-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--white);
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-left: auto;
      transition: all 0.2s;
    }

    .set-custom-btn:hover {
      background: #334155;
    }

    .controls {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 1.05rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary { 
      background: linear-gradient(135deg, #16a34a 0%, #0d9488 100%); 
      color: #fff; 
    }
    .btn-secondary { background: #1c2333; color: var(--white); }

    /* Right Panel */
    .right-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Game Selector Switch */
    .game-selector-row {
      display: flex;
      gap: 0.6rem;
      width: 100%;
      max-width: 460px;
      margin-bottom: 0.8rem;
    }

    .mode-btn {
      flex: 1;
      padding: 0.65rem 0;
      background: #0a0d16;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--gray);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #1e293b;
      color: #38bdf8;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .game-hud-bar {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090c14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 1.4rem;
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: #e2e8f0;
    }

    .progress-bar-track {
      width: 460px;
      height: 8px;
      background: #151a27;
      border-radius: 4px;
      margin-bottom: 0.8rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e 0%, #38bdf8 100%);
      transition: width 0.3s ease;
    }

    .arena-square {
      width: 460px;
      height: 460px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle, #101626 0%, #06080e 100%);
      border: 2px solid #232d44;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.7);
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 5;
      cursor: crosshair;
    }

    /* Finale Scene Stage */
    .finale-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .nest {
      position: absolute;
      bottom: 60px;
      width: 180px;
      height: 45px;
      background: radial-gradient(ellipse, #78350f 0%, #451a03 100%);
      border-radius: 50%;
      border: 2px solid #92400e;
      box-shadow: 0 10px 20px rgba(0,0,0,0.7);
    }

    #henActor {
      position: absolute;
      bottom: 85px;
      width: 120px;
      height: 120px;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      transform: translateX(0);
      z-index: 10;
    }

    #eggActor {
      position: absolute;
      bottom: 75px;
      width: 55px;
      height: 70px;
      opacity: 1;
      transform: scale(1);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      z-index: 9;
    }

    #dinoActor {
      position: absolute;
      bottom: -320px;
      left: 20px;
      width: 420px;
      height: 380px;
      z-index: 12;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    #dinoActor.emerge {
      transform: translateY(-260px);
    }

    .dino-jaw {
      transform-origin: 180px 220px;
      transition: transform 0.18s ease-in-out;
    }

    .chomp .dino-jaw {
      transform: rotate(-24deg);
    }

    .quake {
      animation: arenaQuake 0.5s infinite;
    }

    @keyframes arenaQuake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -3px); }
      60% { transform: translate(-3px, -2px); }
      80% { transform: translate(3px, 2px); }
      100% { transform: translate(0, 0); }
    }

    @media (max-width: 980px) {
      .dashboard-container {
        flex-direction: column;
        gap: 2.5rem;
        padding: 2rem;
      }
      .left-panel {
        align-items: center;
        text-align: center;
        width: 100%;
      }
      .arena-square, .progress-bar-track, .game-hud-bar, .game-selector-row {
        width: 340px;
        max-width: 340px;
      }
      .arena-square { height: 340px; }
      .progress-bar-track { height: 8px; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="left-panel">
      <h1>Egg Time</h1>
      <p class="subtitle">Choose a mini-game to play while your timer counts down</p>

      <div class="time-readout" id="display">00:15</div>

      <div class="presets-row">
        <button class="preset-btn" data-seconds="15">15s Demo</button>
        <button class="preset-btn" data-seconds="60">1 Min</button>
        <button class="preset-btn" data-seconds="180">3 Min</button>
      </div>

      <div class="custom-inputs">
        <input type="number" id="customMin" min="0" max="999" placeholder="0" />
        <span>m</span>
        <input type="number" id="customSec" min="0" max="59" placeholder="0" />
        <span>s</span>
        <button class="set-custom-btn" id="applyCustomBtn">Set Custom</button>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
        <button class="btn btn-primary" id="startBtn">Start</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="game-selector-row">
        <button class="mode-btn active" id="modeCityBtn">🏙 City Smasher</button>
        <button class="mode-btn" id="modeCatchBtn">🍳 Egg Catch</button>
      </div>

      <div class="game-hud-bar">
        <span>SCORE: <strong id="hudScore" style="color: #22c55e;">0</strong></span>
        <span id="hudSubLabel">HEAT GAUGE: <strong id="hudSubValue" style="color: #38bdf8;">ACTIVE</strong></span>
      </div>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <div class="arena-square" id="arenaSquare">
        <canvas id="gameCanvas" width="460" height="460"></canvas>

        <div class="finale-stage" id="finaleStage">
          <div class="nest"></div>

          <div id="henActor">
            <svg viewBox="0 0 120 120">
              <path d="M 30 70 C 10 60, 10 40, 25 35 C 20 50, 35 55, 45 60 Z" fill="#e2e8f0"/>
              <path d="M 75 25 C 70 12, 82 8, 86 18 C 90 10, 100 12, 96 24 Z" fill="#ef4444"/>
              <ellipse cx="60" cy="70" rx="36" ry="32" fill="#f8fafc"/>
              <circle cx="82" cy="40" r="18" fill="#f8fafc"/>
              <ellipse cx="52" cy="72" rx="20" ry="15" fill="#cbd5e1"/>
              <polygon points="98,38 114,44 98,50" fill="#f59e0b"/>
              <ellipse cx="94" cy="55" rx="5" ry="8" fill="#ef4444"/>
              <circle cx="88" cy="36" r="4" fill="#0f172a"/>
              <circle cx="89.5" cy="34.5" r="1.5" fill="#fff"/>
            </svg>
          </div>

          <div id="eggActor">
            <svg viewBox="0 0 100 130">
              <defs>
                <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="70%" stop-color="#f1f5f9"/>
                  <stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
              </defs>
              <path d="M 50 5 C 20 5, 5 45, 5 80 C 5 110, 25 125, 50 125 C 75 125, 95 110, 95 80 C 95 45, 80 5, 50 5 Z" fill="url(#eggGrad)"/>
              <path d="M 28 25 C 38 12, 55 12, 60 18" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
            </svg>
          </div>

          <div id="dinoActor">
            <svg viewBox="0 0 420 380">
              <defs>
                <linearGradient id="dinoSkin" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#15803d"/>
                  <stop offset="60%" stop-color="#14532d"/>
                  <stop offset="100%" stop-color="#052e16"/>
                </linearGradient>
              </defs>
              <path d="M 120 220 C 100 120, 160 50, 270 60 C 350 70, 390 120, 400 170 C 370 185, 330 180, 260 190 C 210 200, 160 210, 120 220 Z" fill="url(#dinoSkin)"/>
              <ellipse cx="375" cy="135" rx="7" ry="5" fill="#052e16"/>
              <path d="M 240 105 C 270 95, 300 110, 290 125 Z" fill="#052e16"/>
              <circle cx="265" cy="115" r="9" fill="#facc15"/>
              <ellipse cx="266" cy="115" rx="3" ry="8" fill="#000"/>

              <polygon points="260,190 268,212 276,190" fill="#fff"/>
              <polygon points="280,188 288,214 296,188" fill="#fff"/>
              <polygon points="305,185 313,215 321,185" fill="#fff"/>
              <polygon points="330,180 340,210 348,180" fill="#fff"/>
              <polygon points="360,175 370,205 378,175" fill="#fff"/>

              <g class="dino-jaw" id="dinoJaw">
                <path d="M 140 220 C 200 225, 270 230, 380 195 C 370 240, 320 270, 240 265 C 180 260, 150 245, 140 220 Z" fill="#14532d"/>
                <polygon points="270,225 277,204 285,225" fill="#fff"/>
                <polygon points="295,220 303,198 311,220" fill="#fff"/>
                <polygon points="325,212 333,190 341,212" fill="#fff"/>
                <polygon points="350,205 358,182 366,205" fill="#fff"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function playSfx(f1, f2, dur, type = 'sine') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + dur);
        gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    let totalSeconds = 15;
    let remainingSeconds = 15;
    let timerInterval = null;
    let isRunning = false;
    let selectedGame = 'city'; // 'city' or 'catch'

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const presetButtons = document.querySelectorAll('.preset-btn');
    const customMin = document.getElementById('customMin');
    const customSec = document.getElementById('customSec');
    const applyCustomBtn = document.getElementById('applyCustomBtn');
    const progressBar = document.getElementById('progressBar');

    const modeCityBtn = document.getElementById('modeCityBtn');
    const modeCatchBtn = document.getElementById('modeCatchBtn');
    const hudScore = document.getElementById('hudScore');
    const hudSubLabel = document.getElementById('hudSubLabel');
    const hudSubValue = document.getElementById('hudSubValue');

    const arenaSquare = document.getElementById('arenaSquare');
    const finaleStage = document.getElementById('finaleStage');
    const henActor = document.getElementById('henActor');
    const eggActor = document.getElementById('eggActor');
    const dinoActor = document.getElementById('dinoActor');
    const dinoJaw = document.getElementById('dinoJaw');

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameActive = false;
    let animationFrameId = null;
    let score = 0;
    let mousePos = { x: 230, y: 230 };
    let isInteracting = false;
    let particles = [];

    // Game 1 Data: City Smasher
    let buildings = [];
    let tanks = [];

    // Game 2 Data: Egg Catch
    let paddle = { x: 190, y: 410, w: 75, h: 14 };
    let fallingItems = [];
    let catchSpawnTimer = 0;
    let lives = 3;

    function selectGameMode(mode) {
      selectedGame = mode;
      modeCityBtn.classList.toggle('active', mode === 'city');
      modeCatchBtn.classList.toggle('active', mode === 'catch');

      if (mode === 'city') {
        hudSubLabel.innerHTML = 'HEAT GAUGE: <strong id="hudSubValue" style="color: #38bdf8;">ACTIVE</strong>';
      } else {
        hudSubLabel.innerHTML = 'LIVES: <strong id="hudSubValue" style="color: #ef4444;">❤❤❤</strong>';
      }

      if (gameActive) {
        initCurrentGame();
      }
    }

    modeCityBtn.addEventListener('click', () => selectGameMode('city'));
    modeCatchBtn.addEventListener('click', () => selectGameMode('catch'));

    function initCurrentGame() {
      score = 0;
      hudScore.textContent = score;
      particles = [];

      if (selectedGame === 'city') {
        buildings = [];
        tanks = [];
        let currentX = 10;
        while (currentX < canvas.width - 20) {
          const width = Math.floor(Math.random() * 25 + 35);
          const height = Math.floor(Math.random() * 140 + 80);
          buildings.push({
            x: currentX,
            y: canvas.height - height - 30,
            w: width,
            h: height,
            hp: Math.floor(height / 10)
          });
          currentX += width + 6;
        }
        tanks.push({ x: 40, y: canvas.height - 24, w: 28, h: 14, speed: 1.2, dir: 1 });
        tanks.push({ x: 300, y: canvas.height - 24, w: 28, h: 14, speed: 0.9, dir: -1 });
      } else {
        fallingItems = [];
        catchSpawnTimer = 0;
        lives = 3;
        const subVal = document.getElementById('hudSubValue');
        if (subVal) subVal.textContent = '❤❤❤';
      }
    }

    function createExplosion(x, y, color = '#f97316', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 8 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: Math.random() * 5 + 2,
          color: color,
          life: 1.0
        });
      }
    }

    // Controls for both games (mouse/touch)
    function updatePointer(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      mousePos.x = clientX - r.left;
      mousePos.y = clientY - r.top;
      paddle.x = Math.max(10, Math.min(canvas.width - paddle.w - 10, mousePos.x - paddle.w / 2));
    }

    canvas.addEventListener('mousedown', (e) => {
      isInteracting = true;
      updatePointer(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => { isInteracting = false; });
    canvas.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));

    canvas.addEventListener('touchstart', (e) => {
      isInteracting = true;
      if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { isInteracting = false; });
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // Loop
    function gameLoop() {
      if (!gameActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (selectedGame === 'city') {
        renderCityGame();
      } else {
        renderCatchGame();
      }

      // Shared particle physics
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.life -= 0.035;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1.0;

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Mode 1: City Smasher
    function renderCityGame() {
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

      for (let i = buildings.length - 1; i >= 0; i--) {
        const b = buildings[i];
        ctx.fillStyle = '#1e2638';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        ctx.fillStyle = b.hp < 4 ? '#ef4444' : '#fef08a';
        for (let row = 1; row < b.h / 18; row++) {
          for (let col = 1; col < b.w / 14; col++) {
            if ((row + col) % 2 === 0) ctx.fillRect(b.x + col * 10, b.y + row * 16, 4, 7);
          }
        }

        if (isInteracting && mousePos.x >= b.x && mousePos.x <= b.x + b.w && mousePos.y >= b.y && mousePos.y <= b.y + b.h) {
          b.hp -= 0.35;
          createExplosion(mousePos.x, mousePos.y, '#38bdf8', 3);
          if (b.hp <= 0) {
            score += 100;
            hudScore.textContent = score;
            createExplosion(b.x + b.w / 2, b.y + b.h / 2, '#f97316', 26);
            playSfx(120, 40, 0.4, 'sawtooth');
            buildings.splice(i, 1);
          }
        }
      }

      for (let i = tanks.length - 1; i >= 0; i--) {
        const t = tanks[i];
        t.x += t.speed * t.dir;
        if (t.x < 10 || t.x > canvas.width - 40) t.dir *= -1;

        ctx.fillStyle = '#475569';
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.fillStyle = '#64748b';
        ctx.fillRect(t.x + (t.dir === 1 ? 14 : 4), t.y - 5, 10, 6);
        ctx.fillRect(t.x + (t.dir === 1 ? 22 : -6), t.y - 3, 12, 2);

        if (isInteracting && Math.hypot(t.x + t.w / 2 - mousePos.x, t.y + t.h / 2 - mousePos.y) < 25) {
          score += 50;
          hudScore.textContent = score;
          createExplosion(t.x + t.w / 2, t.y + t.h / 2, '#ef4444', 18);
          playSfx(240, 60, 0.3, 'square');
          tanks.splice(i, 1);
        }
      }

      if (isInteracting) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(230, -10);
        ctx.lineTo(mousePos.x, mousePos.y);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(230, -10);
        ctx.lineTo(mousePos.x, mousePos.y);
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(mousePos.x, mousePos.y, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Mode 2: Egg Catch
    function renderCatchGame() {
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      catchSpawnTimer++;
      if (catchSpawnTimer % 45 === 0) {
        const isBomb = Math.random() < 0.32;
        fallingItems.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -15,
          radius: isBomb ? 14 : 11,
          speed: 2.2 + Math.random() * 2.0,
          type: isBomb ? 'bomb' : 'egg'
        });
      }

      // Draw Nest / Basket Paddle
      ctx.fillStyle = '#92400e';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      for (let i = fallingItems.length - 1; i >= 0; i--) {
        const it = fallingItems[i];
        it.y += it.speed;

        if (it.type === 'egg') {
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.ellipse(it.x, it.y, it.radius * 0.8, it.radius, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(it.x, it.y, it.radius * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Catch check
        if (
          it.y + it.radius >= paddle.y &&
          it.y - it.radius <= paddle.y + paddle.h &&
          it.x >= paddle.x - 6 &&
          it.x <= paddle.x + paddle.w + 6
        ) {
          if (it.type === 'egg') {
            score += 10;
            hudScore.textContent = score;
            playSfx(550, 880, 0.1, 'triangle');
            createExplosion(it.x, it.y, '#fef08a', 8);
          } else {
            lives = Math.max(0, lives - 1);
            const subVal = document.getElementById('hudSubValue');
            if (subVal) subVal.textContent = '❤'.repeat(lives);
            playSfx(140, 50, 0.3, 'sawtooth');
            createExplosion(it.x, it.y, '#ef4444', 16);
            if (lives === 0) {
              lives = 3;
              if (subVal) subVal.textContent = '❤❤❤';
            }
          }
          fallingItems.splice(i, 1);
          continue;
        }

        if (it.y > canvas.height + 25) fallingItems.splice(i, 1);
      }
    }

    function showGameCanvas(show) {
      gameActive = show;
      canvas.style.display = show ? 'block' : 'none';
      finaleStage.style.display = show ? 'none' : 'flex';

      if (show) {
        initCurrentGame();
        gameLoop();
      } else if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
    }

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      const progressFraction = totalSeconds > 0 ? (remainingSeconds / totalSeconds) : 0;
      progressBar.style.width = `${progressFraction * 100}%`;
    }

    function runFinaleSequence() {
      showGameCanvas(false);

      henActor.style.opacity = '1';
      henActor.style.transform = 'scale(1) translateY(0)';
      eggActor.style.opacity = '0';
      eggActor.style.transform = 'scale(0.2) translateY(20px)';

      setTimeout(() => {
        henActor.style.transform = 'translateY(-12px) scale(1.1, 0.9)';
        playSfx(480, 620, 0.25, 'sine');
      }, 700);

      setTimeout(() => {
        eggActor.style.opacity = '1';
        eggActor.style.transform = 'scale(1) translateY(0)';
        henActor.style.transform = 'translateY(0) scale(1)';
        playSfx(550, 750, 0.2, 'triangle');
      }, 1200);

      setTimeout(() => {
        henActor.style.transform = 'translateX(250px) scale(0.9)';
        henActor.style.opacity = '0';
        playSfx(600, 800, 0.3, 'sine');
      }, 2000);

      setTimeout(() => {
        arenaSquare.classList.add('quake');
        playSfx(80, 50, 0.6, 'sawtooth');
      }, 2700);

      setTimeout(() => {
        dinoActor.classList.add('emerge');
        playSfx(140, 60, 0.8, 'triangle');
      }, 3300);

      setTimeout(() => {
        dinoJaw.parentElement.classList.add('chomp');
        eggActor.style.opacity = '0';
        playSfx(220, 70, 0.4, 'square');
      }, 3900);

      setTimeout(() => {
        arenaSquare.classList.remove('quake');
        dinoJaw.parentElement.classList.remove('chomp');
      }, 4700);

      setTimeout(() => {
        dinoActor.classList.remove('emerge');
      }, 5400);

      setTimeout(() => {
        resetVisuals();
      }, 6200);
    }

    function resetVisuals() {
      showGameCanvas(false);
      arenaSquare.classList.remove('quake');
      henActor.style.opacity = '1';
      henActor.style.transform = 'translateX(0) scale(1)';
      eggActor.style.opacity = '1';
      eggActor.style.transform = 'scale(1)';
      dinoActor.classList.remove('emerge');
      dinoJaw.parentElement.classList.remove('chomp');
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Resume';
        showGameCanvas(false);
        return;
      }

      if (remainingSeconds <= 0) {
        remainingSeconds = totalSeconds;
        resetVisuals();
      }

      isRunning = true;
      startBtn.textContent = 'Pause';
      showGameCanvas(true);

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
          runFinaleSequence();
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      remainingSeconds = totalSeconds;
      startBtn.textContent = 'Start';
      resetVisuals();
      updateDisplay();
    }

    presetButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        totalSeconds = parseInt(btn.getAttribute('data-seconds'), 10);
        resetTimer();
      });
    });

    applyCustomBtn.addEventListener('click', () => {
      const mins = parseInt(customMin.value, 10) || 0;
      const secs = parseInt(customSec.value, 10) || 0;
      const total = mins * 60 + secs;

      if (total > 0) {
        totalSeconds = total;
        resetTimer();
      } else {
        alert('Please enter a duration greater than 0 seconds.');
      }
    });

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);

    updateDisplay();
  </script>
</body>
</html>
